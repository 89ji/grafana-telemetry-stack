services:
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT}:3000'

    environment:
      GF_AUTH_GENERIC_OAUTH_ENABLED: "${GF_AUTH_GENERIC_OAUTH_ENABLED}"
      GF_AUTH_GENERIC_OAUTH_NAME: "${GF_AUTH_GENERIC_OAUTH_NAME}"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "${GF_AUTH_GENERIC_OAUTH_SCOPES}"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "${GF_AUTH_GENERIC_OAUTH_AUTH_URL}"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "${GF_AUTH_GENERIC_OAUTH_TOKEN_URL}"
      GF_AUTH_GENERIC_OAUTH_API_URL: "${GF_AUTH_GENERIC_OAUTH_API_URL}"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "${GF_AUTH_SIGNOUT_REDIRECT_URL}"
      GF_AUTH_OAUTH_AUTO_LOGIN: "${GF_AUTH_OAUTH_AUTO_LOGIN}"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "${GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH}"
      GF_SERVER_ROOT_URL: "${GF_SERVER_ROOT_URL}"

    user: "472"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
        #    depends_on:
        #- prometheus
        #- loki
        #- tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"
    user: "65534"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped
    ports:
      - '${LOKI_PORT}:3100'
    volumes:
      - ./data/loki:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    user: "10001:10001"
    command: -config.file=/etc/loki/loki-config.yaml

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: unless-stopped
    user: root
    environment:
      - TEMPO_PORT=${TEMPO_PORT}
      - TEMPO_OTLP_GRPC_PORT=${TEMPO_OTLP_GRPC_PORT}
      - TEMPO_OTLP_HTTP_PORT=${TEMPO_OTLP_HTTP_PORT}
    ports:
      - "${TEMPO_PORT}:3200"
      - "${TEMPO_OTLP_GRPC_PORT}:${TEMPO_OTLP_GRPC_PORT}"
      - "${TEMPO_OTLP_HTTP_PORT}:${TEMPO_OTLP_HTTP_PORT}"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - ./data/tempo:/var/tempo
    command: -config.file=/etc/tempo.yml -config.expand-env=true

  otel:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: otel-collector
    restart: unless-stopped
    command: --config=/etc/otelcol-config.yml
    volumes:
      - ./otel/otelcol-config.yml:/etc/otelcol-config.yml
    environment:
      - TEMPO_OTLP_GRPC_PORT=${TEMPO_OTLP_GRPC_PORT}
      - TEMPO_OTLP_HTTP_PORT=${TEMPO_OTLP_HTTP_PORT}
    ports:
      - "${OTEL_GRPC_INGEST_PORT}:4317"
      - "${OTEL_HTTP_INGEST_PORT}:4318"
      - "${OTEL_PROM_SCRAPE_PORT}:8888"
      - "${OTEL_SPANMETRICS_PORT:-8889}:8889"
