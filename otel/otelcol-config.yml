receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  tail_sampling:
    decision_wait: 10s          # how long to buffer spans before deciding
    num_traces: 100000          # max concurrent traces held in memory
    expected_new_traces_per_sec: 100
    policies:
      - name: errors-policy
        type: status_code
        status_code:
          status_codes: [ERROR]

      - name: slow-traces-policy
        type: latency
        latency:
          threshold_ms: 500

      - name: baseline-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 100  # keep everything in dev

  filter/drop_websockets:
    spans:
      exclude:
        match_type: regexp
        span_names:
          - ".*[Ww]eb[Ss]ocket.*"

  batch:
    timeout: 5s
    send_batch_size: 1000

connectors:
  spanmetrics:
    metrics_flush_interval: 15s
    aggregation_temporality: "CUMULATIVE"
    histogram:
      explicit:
        buckets: [1ms, 2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    dimensions:
      - name: http.request.method
      - name: http.response.status_code
      - name: http.route

exporters:
  otlp/tempo:
    endpoint: tempo:${env:TEMPO_OTLP_GRPC_PORT}
    tls:
      insecure: true

  otlp/loki:
    endpoint: loki:3100
    tls:
      insecure: true

  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_websockets, tail_sampling, batch]
      exporters: [otlp/tempo, spanmetrics]

    metrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheusremotewrite]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/loki]
